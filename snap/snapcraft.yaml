name: ubuntu-cloud-image-changelog
adopt-info: ubuntu-cloud-image-changelog
base: core24
summary: Helpful utility to generate package changelog between two cloud images
description: |
  Helpful utility to generate package changelog between two cloud images
  using their package manifests.

  Usage:
  ubuntu-cloud-image-changelog generate --from-manifest manifest1.manifest --to-manifest manifest2.manifest --from-series=focal --to-series=focal

grade: stable
confinement: classic

platforms:
  amd64:
  arm64:

apps:
  ubuntu-cloud-image-changelog:
    environment:
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
    # Named explicitly, the shebang would find the host python.
    command: bin/python3 -u $SNAP/bin/ubuntu-cloud-image-changelog

parts:
  ubuntu-cloud-image-changelog:
    plugin: python
    source: ubuntu_cloud_image_changelog
    # Classic snaps cannot use the base's python. The staged one also builds
    # the venv, hence python3.12-venv for ensurepip.
    stage-packages:
      - libpython3-stdlib
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-minimal
      - python3.12-minimal
      - python3.12-venv
    build-attributes:
      - enable-patchelf
    override-build: |
      craftctl default
      version="$(python3 -c 'from importlib.metadata import version; print(version("ubuntu-cloud-image-changelog"))')"
      craftctl set version="$version"
